# Every day: do the two undocumented requests the widget reads still exist, with the same shape? Installs the newest
# Claude Code and Codex CLIs and asks them with no login (tests/watch_upstream.py), so a release that renames or
# reshapes either turns this red before a user sees "Unexpected answer". GitHub mails the owner about a failed run.
# No secrets: nothing here logs in. permissions: {} at the top and contents: read for the job; actions pinned by SHA.
name: watch upstream

on:
  schedule:
    - cron: "17 4 * * *"  # 07:17 in Turkey
  workflow_dispatch:

permissions: {}

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - name: The newest Claude Code and Codex
        run: |
          npm install -g @anthropic-ai/claude-code@latest @openai/codex@latest
          # Claude Code's npm package fetches its native binary after install; run that step again if it was skipped
          claude --version || node "$(npm root -g)/@anthropic-ai/claude-code/install.cjs"
          claude --version
          codex --version
      - name: Ask them, with no login
        run: python3 -B tests/watch_upstream.py
