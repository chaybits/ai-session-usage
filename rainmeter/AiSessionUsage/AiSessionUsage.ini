; AI Session Usage, the Rainmeter skin (Windows). The same helper as the Plasma widget, in @Resources\code\,
; asks Claude Code and Codex for their own usage; this file draws what it answers. Logic in Scripts\AiSessionUsage.lua.
; No em dash anywhere: the whole tree ships.

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=#CardColor#
LeftMouseUpAction=[!CommandMeasure mScript "Refresh()"]
ContextTitle=AI Session Usage on GitHub
ContextAction=["https://github.com/chaybits/ai-session-usage"]
ContextTitle2=Refresh now
ContextAction2=[!CommandMeasure mScript "Refresh()"]

[Metadata]
Name=AI Session Usage
Author=chaybits
Information=Your Claude Code and ChatGPT (Codex) subscription limits: session, weekly and per-model caps with reset countdowns. The tools are asked for their own usage over their own protocols; no login is read. | https://github.com/chaybits/ai-session-usage
License=GPL-3.0-or-later
Version=0.1.0

[Variables]
; python.org's installer puts "python" on the PATH; with the py launcher use Python=py and PythonArgs=-3 -B
Python=python
PythonArgs=-B
; empty: claude / codex found on the PATH or where their installers put them
ClaudeProgram=
CodexProgram=
; claudecode (Claude Code asked, the default) or statusline (what Claude Code passes its status line)
ClaudeSource=claudecode
ShowClaude=1
ShowCodex=1
RefreshMinutes=5
StaleMinutes=15
WarnPercent=80
CriticalPercent=95
Width=320
PadX=14
PadTop=12
RowH=46
FontName=Segoe UI
FontSize=10
CardColor=30,30,30,235
TextColor=235,235,235
DimColor=160,160,160
TrackColor=255,255,255,30
AccentColor=61,174,233
WarnColor=246,116,0
CriticalColor=218,68,83
StaleColor=253,188,75

; ---- measures ----
[mTick]
; counts the seconds; a refresh of both providers at the first update and every RefreshMinutes
Measure=Calc
Formula=(Counter - 1) % (#RefreshMinutes# * 60)
IfCondition=mTick = 0
IfTrueAction=[!CommandMeasure mScript "Refresh()"]
IfConditionMode=1
DynamicVariables=1

[mClaude]
; the helper for Claude; Parameter is set by the script from the variables above
Measure=Plugin
Plugin=RunCommand
Program=#Python#
Parameter=
State=Hide
OutputType=UTF8
Timeout=60000
FinishAction=[!CommandMeasure mScript "Answer('claude')"]
DynamicVariables=1

[mCodex]
Measure=Plugin
Plugin=RunCommand
Program=#Python#
Parameter=
State=Hide
OutputType=UTF8
Timeout=60000
FinishAction=[!CommandMeasure mScript "Answer('codex')"]
DynamicVariables=1

[mScript]
Measure=Script
ScriptFile=#@#Scripts\AiSessionUsage.lua
UpdateDivider=30

; ---- meters: the title, two sections with their status lines, eight rows, a footer; the script places them ----
[Title]
Meter=String
X=#PadX#
Y=#PadTop#
W=(#Width# - 2 * #PadX#)
FontFace=#FontName#
FontSize=(#FontSize# + 1)
FontColor=#TextColor#
StringStyle=Bold
AntiAlias=1
Text=AI session usage

[Head1]
Meter=String
X=#PadX#
W=(#Width# - 2 * #PadX#)
FontFace=#FontName#
FontSize=(#FontSize# - 1)
FontColor=#DimColor#
StringStyle=Bold
StringCase=Upper
AntiAlias=1
Hidden=1

[Head2]
Meter=String
X=#PadX#
W=(#Width# - 2 * #PadX#)
FontFace=#FontName#
FontSize=(#FontSize# - 1)
FontColor=#DimColor#
